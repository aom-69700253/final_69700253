<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" >
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>
<body>
     <!--Menu-->
<div id="menu-container"></div>

    <div class="container  ">
<form id=""> 
        <div class="row  ">
            <div class="col-md-6 mx-auto mt-5 bg-light   rounded">
                <div class="h3 text-center	text-primary mt-3 ">Register</div>
                <div class="mb-3 mt-4 ">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="firstname-lastname" required>
                </div>
                <div class="mb-3 mt-4 ">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <div class="mb-3 mt-4">
                    <label class="form-label">Phone Number</label>
                    <textarea class="form-control" id="textDetail" required></textarea>
                </div>
                <div class="mb-3 mt-4 ">
                    <label class="form-label">Select Course</label>
                    <input type="text" class="form-control" id="username" required>
                </div>
                <div class="text-center mb-4">
                    <input type="submit" id="submit" class="btn btn-primary" value="Submit">
                    <input type="reset" id="reset" class="btn btn-primary" value="Cancel">
                </div>
            </div>
        </div>
    </form>
    </div>
    <!-- Footer Container -->
  <div id="Footer"></div>
</body>
</html>
